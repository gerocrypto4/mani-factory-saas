spring.config.activate.on-profile=dev

jwt.secret=${JWT_SECRET:dev-only-local-secret-change-me}
jwt.allow-insecure-dev-key=true

auth.bootstrap.enabled=${AUTH_BOOTSTRAP_ENABLED:true}
auth.bootstrap.allow-default-credentials=${AUTH_BOOTSTRAP_ALLOW_DEFAULT_CREDENTIALS:true}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

products.bootstrap.enabled=${PRODUCTS_BOOTSTRAP_ENABLED:true}
