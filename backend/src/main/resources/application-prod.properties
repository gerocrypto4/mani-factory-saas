auth.bootstrap.enabled=false
auth.bootstrap.allow-default-credentials=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
jwt.allow-insecure-dev-key=false
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://example.com}
app.rate-limit.enabled=true
app.rate-limit.max-requests=${APP_RATE_LIMIT_MAX_REQUESTS:120}
app.rate-limit.window-seconds=${APP_RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.login-max-requests=${APP_RATE_LIMIT_LOGIN_MAX_REQUESTS:12}
