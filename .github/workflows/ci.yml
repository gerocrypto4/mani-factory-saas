name: CI

on:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build and test backend
        working-directory: backend/backend
        run: |
          chmod +x mvnw
          ./mvnw -q test
